<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara Neulinger - Redirection</title>
    <style>
        body { margin:0; font-family: Arial, sans-serif; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .box { max-width:600px; padding:24px; text-align:center; }
        .btn { display:inline-block; margin:8px; padding:12px 20px; background:#222; color:#fff; border:1px solid #444; border-radius:6px; cursor:pointer; text-decoration:none; }
        .notice { margin-top:12px; color:#bbb; font-size:14px; }
    </style>
    <script>
        // Détection mobile/desktop et redirection automatique
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 800;
        }
        
        // Redirection immédiate
        setTimeout(function() {
            if (isMobile()) {
                window.location.replace('mobile/');
            } else {
                window.location.replace('desktop/');
            }
        }, 500);
    </script>
</head>
<body>
    <div class="box">
        <h1>Clara Neulinger - Redirection en cours...</h1>
        <p>Vous êtes redirigé vers la version adaptée à votre appareil.</p>
        <div>
            <a href="desktop/" class="btn">Version Desktop</a>
            <a href="mobile/" class="btn">Version Mobile</a>
        </div>
        <p class="notice">Si la redirection ne fonctionne pas, cliquez sur le bouton correspondant.</p>
    </div>
</body>
</html>
