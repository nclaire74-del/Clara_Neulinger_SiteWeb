    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Kindergarten', cursive, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .loader-container {
            text-align: center;
            color: #f5f1e8;
        }
        
        .logo {
            font-size: 3rem;
            margin-bottom: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(245, 241, 232, 0.2);
            border-top: 4px solid #f5f1e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        
        .message {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 1rem;
        }
        
        .device-info {
            font-size: 0.9rem;
            opacity: 0.6;
            margin-top: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="logo">🎨</div>
        <div class="spinner"></div>
        <div class="message" id="message">Détection de votre appareil...</div>
        <div class="device-info" id="device-info"></div>
    </div>

    <script>
        console.log('🎯 Détection de device - Clara Neulinger Portfolio');
        
        // ============================================
        // DÉTECTION DU TYPE D'APPAREIL
        // ============================================
        
        function detectDevice() {
            const ua = navigator.userAgent.toLowerCase();
            const width = window.innerWidth;
            const height = window.innerHeight;
            const touchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            
            console.log('📱 User Agent:', ua);
            console.log('📐 Résolution:', width + 'x' + height);
            console.log('👆 Touch Device:', touchDevice);
            
            // Détection tablette (priorité haute)
            const isTablet = (
                /(ipad|tablet|playbook|silk)|(android(?!.*mobile))/i.test(ua) ||
                (touchDevice && Math.min(width, height) >= 768 && Math.max(width, height) >= 1024)
            );
            
            // Détection mobile
            const isMobile = /mobile|iphone|ipod|android|blackberry|opera mini|windows phone/i.test(ua) && !isTablet;
            
            // Desktop par défaut
            const isDesktop = !isMobile && !isTablet;
            
            return { isMobile, isTablet, isDesktop, width, height, touchDevice };
        }
        
        // ============================================
        // REDIRECTION VERS LA VERSION APPROPRIÉE
        // ============================================
        
        function redirectToAppropriateVersion() {
            const device = detectDevice();
            const currentPath = window.location.pathname;
            
            // Afficher les informations de détection
            let deviceType = '';
            if (device.isMobile) deviceType = '📱 Mobile';
            else if (device.isTablet) deviceType = '📱 Tablette';
            else deviceType = '💻 Desktop';
            
            document.getElementById('device-info').textContent = 
                `${deviceType} | ${device.width}x${device.height} | Touch: ${device.touchDevice ? 'Oui' : 'Non'}`;
            
            // Prévenir les boucles infinies
            if (currentPath.includes('/desktop/') || currentPath.includes('/mobile/')) {
                console.log('✅ Déjà sur une version spécifique, pas de redirection');
                return;
            }
            
            // Déterminer la redirection
            let redirectUrl = '';
            
            if (device.isMobile || device.isTablet) {
                // Mobile ET Tablette → Version mobile
                redirectUrl = './mobile/index.html';
                document.getElementById('message').textContent = 'Redirection vers la version mobile...';
                console.log('🔄 Redirection vers MOBILE (écran tactile)');
            } else {
                // Desktop → Version desktop
                redirectUrl = './desktop/index.html';
                document.getElementById('message').textContent = 'Redirection vers la version desktop...';
                console.log('🔄 Redirection vers DESKTOP');
            }
            
            // Redirection après 1 seconde
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 1000);
        }
        
        // ============================================
        // INITIALISATION
        // ============================================
        
        // Lancer la détection immédiatement
        redirectToAppropriateVersion();
        
        // Gérer le changement d'orientation ou de taille d'écran
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                console.log('📐 Redimensionnement détecté, nouvelle vérification...');
                redirectToAppropriateVersion();
            }, 500);
        });
    </script>
</body>
