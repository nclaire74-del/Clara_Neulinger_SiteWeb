<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Animation TV Simple</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }
        
        .test-video {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            animation: gradient 3s ease infinite;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Animation TV shutdown exacte */
        .tv-shutdown {
            animation: tvShutdown 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards !important;
            position: relative !important;
            overflow: hidden !important;
        }
        
        @keyframes tvShutdown {
            0% {
                transform: scale(1, 1);
                filter: brightness(1) contrast(1);
                opacity: 1;
            }
            10% {
                transform: scale(1, 0.8);
                filter: brightness(1.2) contrast(1.3);
                opacity: 1;
            }
            30% {
                transform: scale(1, 0.1);
                filter: brightness(2.5) contrast(3);
                opacity: 0.9;
            }
            60% {
                transform: scale(0.3, 0.02);
                filter: brightness(5) contrast(8);
                opacity: 0.7;
            }
            85% {
                transform: scale(0.1, 0.005);
                filter: brightness(10) contrast(15);
                opacity: 0.3;
            }
            95% {
                transform: scale(0.02, 0.001);
                filter: brightness(20) contrast(25);
                opacity: 0.1;
            }
            100% {
                transform: scale(0, 0);
                filter: brightness(0) contrast(0);
                opacity: 0;
            }
        }
        
        .test-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            font-size: 18px;
            font-family: Arial, sans-serif;
            cursor: pointer;
            border-radius: 5px;
        }
        
        .test-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="test-video" id="test-element">
        <button class="test-button" onclick="testTvShutdown()">
            CLIQUER POUR TESTER TV SHUTDOWN
        </button>
    </div>
    
    <script>
        function testTvShutdown() {
            console.log('Test TV Shutdown démarré');
            const element = document.getElementById('test-element');
            element.classList.add('tv-shutdown');
            
            // Vérifier les styles
            setTimeout(() => {
                const styles = window.getComputedStyle(element);
                console.log('Styles appliqués:', {
                    animation: styles.animation,
                    animationName: styles.animationName,
                    animationDuration: styles.animationDuration,
                    transform: styles.transform
                });
            }, 100);
            
            // Reset après 2 secondes
            setTimeout(() => {
                element.classList.remove('tv-shutdown');
                console.log('Animation réinitialisée');
            }, 2000);
        }
    </script>
</body>
</html>
