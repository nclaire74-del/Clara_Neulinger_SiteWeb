<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Préchargement des ressources critiques -->
    <link rel="preload" href="../desktop/font/kindergarten.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="prefetch" href="../../05_PROJETS_3D/Images_Portfolio/Logos/pngwing.com.png">
    
    <title>Clara Neulinger - Portfolio Mobile</title>
    <style>
        @font-face {
            font-family: 'Kindergarten';
            src: url('../desktop/font/kindergarten.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        
        /* Reset et variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background: #000000 !important;
            font-family: 'Kindergarten', Arial, sans-serif;
            
            /* Optimisations performances mobiles */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeSpeed;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        /* Optimisations GPU pour animations */
        * {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        
        /* Optimisations scrolling mobile */
        * {
            -webkit-overflow-scrolling: touch;
            overflow-scrolling: touch;
        }
        
        /* Écran de chargement DESKTOP EXACT */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: 'Kindergarten', cursive;
            cursor: none;
            overflow: hidden;
        }
        
        /* Titre Clara Neulinger au-dessus du spinner */
        .loading-title {
            font-size: clamp(1.8rem, 4vw, 2.2rem);
            color: #f5f1e8;
            text-align: center;
            margin-bottom: 0.75vh;
            font-weight: normal;
            text-shadow: none;
            opacity: 0.9;
        }

        /* Sous-titre Loading Please Wait */
        .loading-subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            color: #e8dcc0;
            text-align: center;
            margin-bottom: 3vh;
            font-weight: normal;
            text-shadow: none;
            opacity: 0.8;
        }

        /* Spinner dessiné à la main pour le chargement */
        .spinner {
            width: 60px;
            height: 60px;
            border: 2px solid transparent;
            border-radius: 50%;
            position: relative;
            margin-bottom: 30px;
            animation: drawSpinner 3s infinite linear;
        }

        /* Première couche du gribouillage du spinner */
        .spinner::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border: 2px solid #f5f1e8;
            border-radius: 50%;
            animation: scribbleSpinner1 1.5s infinite ease-in-out;
            opacity: 0.8;
        }

        /* Deuxième couche du gribouillage du spinner */
        .spinner::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 1px solid #e8dcc0;
            border-radius: 50%;
            animation: scribbleSpinner2 1.8s infinite ease-in-out;
            opacity: 0.6;
        }

        /* Conteneur de la barre de progression */
        .loading-bar-container {
            width: min(300px, 80vw);
            height: 10px;
            background: transparent;
            position: relative;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        /* Couches supplémentaires pour effet gribouillage intense */
        .loading-bar-container::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 3px solid #f5f1e8;
            border-radius: 4px;
            animation: visibleScribble1 3s infinite linear;
            opacity: 0.95;
            z-index: 4;
            box-shadow: 0 0 1px rgba(245, 241, 232, 0.8);
        }

        .loading-bar-container::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -4px;
            right: -1px;
            bottom: -4px;
            border: 1px solid #e8dcc0;
            border-radius: 2px;
            animation: visibleScribble2 2.5s infinite linear;
            opacity: 0.85;
            z-index: 3;
        }

        /* Barre de progression principale - avec variations de remplissage */
        #loading-bar {
            height: 100%;
            background: #f5f1e8;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            width: 0%;
            transition: width 0.3s ease-out;
            box-shadow: none;
            opacity: 0.9;
        }

        /* Effet de texture sur la barre */
        #loading-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255,255,255,0.3) 25%, 
                transparent 50%, 
                rgba(255,255,255,0.2) 75%, 
                transparent 100%);
            animation: shimmer 2s infinite;
        }

        /* Pourcentage - style mat */
        #loading-percentage {
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            color: #f5f1e8;
            margin-top: 15px;
            margin-bottom: 10px;
            font-weight: normal;
            text-align: center;
            text-shadow: none;
            opacity: 0.9;
        }

        /* Messages de chargement - style mat */
        #loading-message {
            font-size: clamp(0.9rem, 2vw, 1rem);
            color: #e8dcc0;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 0;
            font-weight: normal;
            text-shadow: none;
            line-height: 1.4;
            opacity: 0.8;
            animation: fadeInOut 3s infinite;
            transition: all 0.3s ease;
            padding: 0 1rem;
        }

        /* Animations */
        @keyframes drawSpinner {
            0% { transform: rotate(0deg); border-top-color: #f5f1e8; }
            25% { border-right-color: #e8dcc0; }
            50% { transform: rotate(180deg); border-bottom-color: #f5f1e8; }
            75% { border-left-color: #e8dcc0; }
            100% { transform: rotate(360deg); border-top-color: #f5f1e8; }
        }

        /* Animation gribouillage spinner - première couche */
        @keyframes scribbleSpinner1 {
            0%, 100% { 
                border-radius: 45% 55% 48% 52%;
                border-width: 1px 3px 2px 1px;
                opacity: 0.8;
                transform: rotate(0deg);
            }
            20% { 
                border-radius: 52% 48% 55% 45%;
                border-width: 3px 1px 1px 2px;
                opacity: 0.6;
                transform: rotate(0.5deg);
            }
            40% { 
                border-radius: 48% 52% 45% 55%;
                border-width: 2px 2px 3px 1px;
                opacity: 0.9;
                transform: rotate(-0.3deg);
            }
            60% { 
                border-radius: 55% 45% 52% 48%;
                border-width: 1px 2px 1px 3px;
                opacity: 0.7;
                transform: rotate(0.2deg);
            }
            80% { 
                border-radius: 47% 53% 49% 51%;
                border-width: 3px 1px 2px 2px;
                opacity: 0.8;
                transform: rotate(-0.1deg);
            }
        }

        /* Animation gribouillage spinner - deuxième couche */
        @keyframes scribbleSpinner2 {
            0%, 100% { 
                border-radius: 53% 47% 49% 51%;
                border-width: 2px 1px 1px 2px;
                opacity: 0.6;
                transform: rotate(0deg);
            }
            25% { 
                border-radius: 49% 51% 47% 53%;
                border-width: 1px 2px 2px 1px;
                opacity: 0.8;
                transform: rotate(-0.2deg);
            }
            50% { 
                border-radius: 51% 49% 53% 47%;
                border-width: 2px 1px 1px 2px;
                opacity: 0.5;
                transform: rotate(0.1deg);
            }
            75% { 
                border-radius: 47% 53% 51% 49%;
                border-width: 1px 2px 1px 2px;
                opacity: 0.7;
                transform: rotate(-0.1deg);
            }
        }

        /* Animations gribouillage barre de progression */
        @keyframes visibleScribble1 {
            0%, 100% { 
                border-radius: 3px 1px 4px 2px;
                border-width: 2px 4px 3px 2px;
                opacity: 0.95;
                transform: rotate(-0.2deg);
            }
            25% { 
                border-radius: 4px 2px 3px 1px;
                border-width: 3px 2px 4px 3px;
                opacity: 0.8;
                transform: rotate(0.3deg);
            }
            50% { 
                border-radius: 2px 4px 1px 3px;
                border-width: 4px 3px 2px 4px;
                opacity: 0.9;
                transform: rotate(-0.1deg);
            }
            75% { 
                border-radius: 1px 3px 4px 2px;
                border-width: 2px 4px 3px 2px;
                opacity: 0.85;
                transform: rotate(0.2deg);
            }
        }

        @keyframes visibleScribble2 {
            0%, 100% { 
                border-radius: 2px 1px 3px 1px;
                border-width: 1px 2px 1px 2px;
                opacity: 0.85;
                transform: rotate(0.1deg);
            }
            33% { 
                border-radius: 1px 3px 1px 2px;
                border-width: 2px 1px 2px 1px;
                opacity: 0.7;
                transform: rotate(-0.2deg);
            }
            66% { 
                border-radius: 3px 2px 2px 1px;
                border-width: 1px 2px 1px 2px;
                opacity: 0.9;
                transform: rotate(0.15deg);
            }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        
        /* Vidéo de fond */
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        /* Effet de vignettage noir */
        #video-vignette-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.3) 70%, rgba(0, 0, 0, 0.7) 100%);
            z-index: 2;
            pointer-events: none;
        }
        
        /* Interface utilisateur principale */
        #main-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: none;
        }
        
        .ui-overlay {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            z-index: 10;
        }
        
        /* Titre du jeu */
        .game-title {
            text-align: center;
            margin-bottom: 3rem;
            z-index: 10;
        }
        
        .game-title h1 {
            font-family: 'Kindergarten', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: #f5f1e8;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            margin-bottom: 0.5rem;
        }
        
        .game-title .subtitle {
            font-family: 'Kindergarten', cursive;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: #e8dcc0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        
        /* Menu principal */
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        
        /* Boutons style épuré - Texte seul avec encadrement gribouillé DESKTOP */
        .game-button {
            background: transparent !important;
            border: none;
            color: #ffffff;
            padding: 25px 35px;
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            font-family: 'Kindergarten', sans-serif;
            cursor: pointer;
            min-width: min(320px, 80vw);
            text-align: left;
            position: relative;
            text-shadow: none;
            z-index: 3;
            outline: none;
            box-shadow: none;
            transition: transform 0.1s ease-out;
            transform-origin: left center;
        }

        /* Encadrement gribouillé - Première couche fine */
        .game-button::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border: 0.5px solid rgba(255, 255, 255, 0.25);
            z-index: -1;
            pointer-events: none;
            border-radius: 2px 0.5px 2.5px 1px;
            transform: rotate(-0.3deg);
        }

        /* Encadrement gribouillé - Deuxième couche fine superposée */
        .game-button::after {
            content: '';
            position: absolute;
            top: -0.5px;
            left: -0.5px;
            right: -0.5px;
            bottom: -0.5px;
            border: 0.5px solid rgba(255, 255, 255, 0.3);
            z-index: -1;
            pointer-events: none;
            border-radius: 1px 2.5px 0.5px 1.5px;
            transform: rotate(0.2deg);
        }

        .game-button:hover {
            background: transparent !important;
        }

        .game-button:hover::before {
            border-color: rgba(255, 255, 255, 0.4);
            border-width: 0.7px;
            transform: rotate(-0.5deg);
        }

        .game-button:hover::after {
            border-color: rgba(255, 255, 255, 0.5);
            border-width: 0.7px;
            transform: rotate(0.4deg);
        }

        .game-button:focus {
            background: transparent !important;
            outline: none;
            box-shadow: none;
            border: none;
        }

        .game-button:active {
            background: transparent !important;
            transform: scale(1.1);
        }
        
        .button-text {
            display: block;
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            font-weight: bold;
            margin-bottom: 0.2rem;
        }
        
        .button-subtitle {
            display: block;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #e8dcc0;
            opacity: 0.8;
        }
        
        /* Overlays/Windows */
        .contact-overlay, .portfolio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            flex-direction: column;
            padding: 1rem;
            overflow-y: auto;
            justify-content: center;
            align-items: center;
        }
        
        .contact-overlay.show, .portfolio-overlay.show {
            display: flex;
        }
        
        /* Contact Window */
        .papers-container {
            background: transparent;
            border: none;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            margin: 0 auto;
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }

        /* Encadrement gribouillé pour contact */
        .papers-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: -1;
            pointer-events: none;
            border-radius: 3px 1px 4px 2px;
            transform: rotate(-0.2deg);
        }

        .papers-container::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: -1;
            pointer-events: none;
            border-radius: 2px 4px 1px 3px;
            transform: rotate(0.3deg);
        }

        /* Encadrements gribouillés pour le modal mobile et boutons */
        .game-button {
            position: relative;
        }
        
        .game-button::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 2px solid rgba(245, 241, 232, 0.6);
            z-index: -1;
            pointer-events: none;
            border-radius: 8px 3px 9px 4px;
            transform: rotate(-0.4deg);
        }
        
        .game-button::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border: 2px solid rgba(245, 241, 232, 0.4);
            z-index: -1;
            pointer-events: none;
            border-radius: 6px 4px 7px 2px;
            transform: rotate(0.3deg);
        }

        /* Encadrements pour les tags dans le modal */
        .project-modal-mobile span[style*="border"] {
            position: relative;
        }
        
        .project-modal-mobile span[style*="border"]::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 1px solid rgba(245, 241, 232, 0.4);
            border-radius: 22px 19px 21px 20px;
            z-index: -1;
            pointer-events: none;
            transform: rotate(-0.2deg);
        }
        
        .project-modal-mobile span[style*="border"]::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border: 1px solid rgba(245, 241, 232, 0.3);
            border-radius: 20px 21px 19px 22px;
            z-index: -1;
            pointer-events: none;
            transform: rotate(0.2deg);
        }
        
        .papers-container h2 {
            font-family: 'Kindergarten', cursive;
            color: #f5f1e8;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 2rem;
        }
        
        .papers-container p {
            color: #e8dcc0;
            font-family: 'Kindergarten', cursive;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            margin-bottom: 1rem;
        }
        
        /* Logos sociaux */
        .social-logos-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        
        .social-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: 2px solid #f5f1e8;
        }
        
        .social-logo:hover {
            transform: scale(1.1);
            border-color: #fff;
        }
        
        .social-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Rendre le logo Contact (CV) blanc */
        .social-logo[data-platform="cv"] img {
            filter: brightness(0) invert(1);
        }
        
        /* Panel Options */
        .options-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 4000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
        }
        
        .options-content {
            background: transparent;
            border: none;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow: visible;
            position: relative;
            text-align: center;
            box-sizing: border-box;
        }
        
        .options-inner {
            max-height: calc(80vh - 4rem);
            overflow-y: auto;
            padding: 0.5rem;
            margin: -0.5rem;
        }
        
        /* Encadrement gribouillé pour options - version renforcée */
        .options-content::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            z-index: -1;
            pointer-events: none;
            border-radius: 4px 2px 5px 3px;
            transform: rotate(-0.3deg);
        }

        .options-content::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            z-index: -1;
            pointer-events: none;
            border-radius: 3px 5px 2px 4px;
            transform: rotate(0.4deg);
        }
        
        .options-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .options-title {
            font-family: 'Kindergarten', cursive;
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: #f5f1e8;
            margin: 0;
        }
        
        .options-close {
            background: rgba(245, 241, 232, 0.1);
            border: 3px solid #f5f1e8;
            color: #f5f1e8;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 45% 55% 52% 48%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(3deg);
            transition: all 0.3s ease;
        }
        
        .options-close:hover {
            transform: rotate(-2deg) scale(1.1);
            background: rgba(245, 241, 232, 0.2);
            box-shadow: 0 0 15px rgba(245, 241, 232, 0.3);
        }
        
        .options-section {
            margin-bottom: 2rem;
        }
        
        .options-section h3 {
            font-family: 'Kindergarten', cursive;
            color: #f5f1e8;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .volume-slider {
            flex: 1;
            height: 8px;
            background: rgba(245, 241, 232, 0.2);
            border: 2px solid rgba(245, 241, 232, 0.4);
            border-radius: 15px 3px 12px 5px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            transform: rotate(-0.5deg);
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: #f5f1e8;
            border: 2px solid rgba(245, 241, 232, 0.8);
            border-radius: 45% 55% 48% 52%;
            cursor: pointer;
            transform: rotate(5deg);
            box-shadow: 
                0 0 0 1px rgba(245, 241, 232, 0.3),
                2px 3px 8px rgba(0, 0, 0, 0.3);

        // Simulation du loading manager
        let loadingProgress = 0;
        
        function simulateLoading() {
            const loadingBar = document.getElementById('loading-bar');
            const loadingPercentage = document.getElementById('loading-percentage');
            const loadingMessage = document.getElementById('loading-message');
            
            // Fonction pour obtenir les messages traduits
            const getLoadingMessages = () => {
                if (window.translationManager) {
                    return [
                        window.translationManager.t('shader_compilation'),
                        window.translationManager.t('loading_textures'),
                        window.translationManager.t('loading_3d_models'),
                        'Configuration mobile...',
                        'Optimisation des performances...',
                        'Finalisation...'
                    ];
                } else {
                    return [
                        'Compilation du shader...',
                        'Chargement des textures...',
                        'Initialisation des modèles 3D...',
                        'Configuration mobile...',
                        'Optimisation des performances...',
                        'Finalisation...'
                    ];
                }
            };
            
            const messages = getLoadingMessages();
            
            const interval = setInterval(() => {
                loadingProgress += Math.random() * 6 + 2;
                
                if (loadingProgress >= 100) {
                    loadingProgress = 100;
                    clearInterval(interval);
                    setTimeout(hideLoader, 800);
                }
                
                loadingBar.style.width = loadingProgress + '%';
                loadingPercentage.textContent = Math.round(loadingProgress) + '%';
                loadingMessage.textContent = messages[Math.floor((loadingProgress / 100) * messages.length)];
            }, 400);
        }
        
        function hideLoader() {
            const loadingScreen = document.getElementById('loading-screen');
            const mainUI = document.getElementById('main-ui');
            
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.5s ease';
            
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                mainUI.style.display = 'block';
                
                // Démarrer la vidéo
                const video = document.getElementById('background-video');
                video.play().catch(e => console.log('Vidéo ne peut pas se lancer:', e));
            }, 500);
        }

        function setLanguage(lang) {
            console.log('🔄 setLanguage appelée avec:', lang);
            
            // Vérifier que les éléments existent
            const frBtn = document.getElementById('lang-fr');
            const enBtn = document.getElementById('lang-en');
            
            if (!frBtn || !enBtn) {
                console.error('❌ Boutons de langue introuvables');
                return;
            }
            
            // Mettre à jour les boutons de langue
            frBtn.classList.remove('active');
            enBtn.classList.remove('active');
            document.getElementById('lang-' + lang).classList.add('active');
            
            // Utiliser le système de traduction
            if (window.translationManager) {
                console.log('🌐 Changement de langue avec TranslationManager:', lang);
                window.translationManager.setLanguage(lang);
                
                // Mettre à jour les hints dynamiques
                setTimeout(() => updateTranslateHints(), 100);
            } else {
                console.error('❌ TranslationManager non disponible lors du changement de langue');
            }
            
            // Sauvegarder la langue choisie (compatibilité avec le TranslationManager)
            localStorage.setItem('language', lang);
            localStorage.setItem('selectedLanguage', lang);
            
            console.log('✅ Langue changée vers:', lang);
        }
        
        // Mettre à jour les éléments translate-hint dynamiques
        function updateTranslateHints() {
            if (window.translationManager) {
                const hintElements = document.querySelectorAll('.translate-hint');
                hintElements.forEach(element => {
                    const mediaType = element.getAttribute('data-media-type');
                    const mediaText = mediaType === 'video' ? 
                        window.translationManager.t('video') : 
                        window.translationManager.t('image');
                    element.textContent = window.translationManager.t('double_click_access_viewer', { media: mediaText });
                });
            }
        }
        
        // Initialisation du panel d'options
        function initOptionsPanel() {
            const volumeSlider = document.getElementById('volume-slider');
            const volumeValue = document.getElementById('volume-value');
            
            // Charger le volume sauvegardé
            const savedVolume = localStorage.getItem('audioVolume') || '50';
            volumeSlider.value = savedVolume;
            volumeValue.textContent = savedVolume + '%';
            
            // Gérer le changement de volume
            volumeSlider.addEventListener('input', function() {
                const volume = this.value;
                volumeValue.textContent = volume + '%';
                localStorage.setItem('audioVolume', volume);
                
                // Appliquer le volume à toutes les vidéos/audios
                const videos = document.querySelectorAll('video, audio');
                videos.forEach(media => {
                    media.volume = volume / 100;
                });
            });
            
            // Charger la langue sauvegardée
            const savedLang = localStorage.getItem('language') || localStorage.getItem('selectedLanguage') || 'fr';
            setLanguage(savedLang);
            
            // Ajouter les gestionnaires d'événements pour les boutons de langue
            document.getElementById('lang-fr').addEventListener('click', () => setLanguage('fr'));
            document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
        }

                        <!-- Navigation -->

                        </div>

                    <p style="text-align: center; color: #e8dcc0; font-family: 'Kindergarten'; font-size: 0.8rem; margin-top: 1rem; opacity: 0.8;" data-translate="swipe_or_arrows_navigate">Utilisez les flèches ou glissez pour naviguer</p>
                </div>
            `;
            
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';

            // 🌍 IMPORTANT: Traduire les éléments dynamiques de la modal galerie
            if (window.translationManager && typeof window.translationManager.updatePage === 'function') {
                translationManager.updatePage();
                console.log('✅ Modal galerie images traduite dynamiquement');
            }

            // Fonctions de navigation
            function updateGalleryImage() {
                const img = document.getElementById('gallery-current-image');
                const current = document.getElementById('gallery-current');
                img.src = baseDir + images[currentIndex];
                current.textContent = currentIndex + 1;
            }

            function nextImage() {
                currentIndex = (currentIndex + 1) % images.length;
                updateGalleryImage();
            }

            function prevImage() {
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                updateGalleryImage();
            }

            // Event listeners
            document.getElementById('gallery-next').addEventListener('click', nextImage);
            document.getElementById('gallery-prev').addEventListener('click', prevImage);

            // Support tactile pour swipe
            let startX = 0;
            const imageContainer = document.getElementById('gallery-image-container');
            
            imageContainer.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            });
            
            imageContainer.addEventListener('touchend', (e) => {
                const endX = e.changedTouches[0].clientX;
                const diffX = startX - endX;
                
                if (Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        nextImage(); // Swipe left -> next
                    } else {
                        prevImage(); // Swipe right -> prev
                    }
                }
            });

            // Navigation clavier
            function handleKeyPress(e) {
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'Escape') closeGalleryModal();
            }
            
            document.addEventListener('keydown', handleKeyPress);
            modal.addEventListener('keydown', handleKeyPress);
        }

            // Chemins vers les dossiers d'images

                'ROUGHNESS': '../../05_PROJETS_3D/projets_portfolio/Arch/ROUPH'

            // Mettre à jour le slider selon l'asset sélectionné
            const sliderMap = {
                'ALBEDO': 1,
                'AO': 2,
                'METALLIC': 3,
                'ROUGHNESS': 4

                slider.min = 1;
                slider.max = 4;

            }
            
            // Frame par défaut pour chaque asset

                'ALBEDO': 128,
                'AO': 135, 
                'METALLIC': 142,
                'ROUGHNESS': 149

                            <!-- Indicateurs -->
                            <div style="display: flex; gap: 0.5rem;">
                                <span id="cv-indicator-0" style="width: 12px; height: 12px; border-radius: 50%; background: #f5f1e8; cursor: pointer;"></span>
                                <span id="cv-indicator-1" style="width: 12px; height: 12px; border-radius: 50%; background: rgba(245, 241, 232, 0.3); cursor: pointer;"></span>
                            </div>
                            
                            <!-- Flèche droite -->
                            <button id="cv-next" style="background: rgba(245, 241, 232, 0.2); border: 2px solid #f5f1e8; color: #f5f1e8; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">›</button>
                        </div>
                    </div>
                    
                    <!-- Instructions -->
                    <p style="text-align: center; color: #e8dcc0; font-family: 'Kindergarten'; font-size: 0.9rem; margin-top: 1rem; opacity: 0.8;" data-translate="swipe_or_arrows_navigate_cv">Utilisez les flèches ou glissez pour naviguer entre les CV</p>
                </div>
            `;

            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';

            // Fonctions de navigation
            function updateCV() {
                const cvImage = document.getElementById('cv-image');
                cvImage.src = cvPaths[currentCVIndex];
                
                // Mettre à jour les indicateurs
                document.querySelectorAll('[id^="cv-indicator-"]').forEach((indicator, index) => {
                    indicator.style.background = index === currentCVIndex ? '#f5f1e8' : 'rgba(245, 241, 232, 0.3)';
                });
            }

            function nextCV() {
                currentCVIndex = (currentCVIndex + 1) % cvPaths.length;
                updateCV();
            }

            function prevCV() {
                currentCVIndex = (currentCVIndex - 1 + cvPaths.length) % cvPaths.length;
                updateCV();
            }

            // Event listeners
            document.getElementById('cv-next').addEventListener('click', nextCV);
            document.getElementById('cv-prev').addEventListener('click', prevCV);
            
            // Indicateurs cliquables
            document.getElementById('cv-indicator-0').addEventListener('click', () => {
                currentCVIndex = 0;
                updateCV();
            });
            document.getElementById('cv-indicator-1').addEventListener('click', () => {
                currentCVIndex = 1;
                updateCV();
            });

            // Support tactile pour swipe
            let startX = 0;
            const cvContainer = document.getElementById('cv-container');
            
            cvContainer.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            });
            
            cvContainer.addEventListener('touchend', (e) => {
                const endX = e.changedTouches[0].clientX;
                const diffX = startX - endX;
                
                if (Math.abs(diffX) > 50) { // Seuil de swipe
                    if (diffX > 0) {
                        nextCV(); // Swipe left -> next
                    } else {
                        prevCV(); // Swipe right -> prev
                    }
                }
            });

            // Navigation clavier
            function handleKeyPress(e) {
                if (e.key === 'ArrowRight') nextCV();
                if (e.key === 'ArrowLeft') prevCV();
                if (e.key === 'Escape') closeCVViewer();
            }
            
            document.addEventListener('keydown', handleKeyPress);
            modal.addEventListener('keydown', handleKeyPress);
        }

        function closeCVViewer() {
            const modal = document.querySelector('.cv-viewer-modal');
            if (modal) {
                modal.remove();
                document.body.style.overflow = 'auto';
            }
        }

        // Optimisations performances mobiles
        function optimizeMobilePerformance() {
            // Optimisation mémoire - libérer les ressources non visibles
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // Charger le contenu quand il devient visible
                        entry.target.style.willChange = 'transform';
                    } else {
                        // Nettoyer les ressources non visibles
                        entry.target.style.willChange = 'auto';
                    }
                });
            }, { rootMargin: '50px' });
            
            // Observer toutes les images et iframes
            document.querySelectorAll('img, iframe, video').forEach(el => {
                observer.observe(el);
            });
            
            // Gestion tactile optimisée
            let touchStartY = 0;
            document.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });
            
            document.addEventListener('touchmove', (e) => {
                const touchY = e.touches[0].clientY;
                const touchDiff = touchStartY - touchY;
                
                // Préventions du bounce effet sur iOS
                if (touchDiff > 0 && window.scrollY === 0) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // Optimisation garbage collector
            setInterval(() => {
                if (window.gc) {
                    window.gc();
                }
            }, 30000); // Nettoyage toutes les 30 secondes
            
            // Préchargement conditionnel basé sur la connexion
            if ('connection' in navigator) {
                const connection = navigator.connection;
                if (connection.effectiveType === '4g' || connection.effectiveType === '3g') {
                    // Précharger quelques ressources sur bonne connexion
                    const link = document.createElement('link');
                    link.rel = 'prefetch';
                    link.href = '../../05_PROJETS_3D/projets_portfolio/Gun/NEULINGER_Clara_2B3DArt_Rendu_Texture.jpg';
                    document.head.appendChild(link);
                }
            }
        }

        // Event Listeners - EXACTEMENT comme desktop
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Site mobile Clara Neulinger avec fonctionnalités desktop !');
            
            // Optimisations mobiles
            optimizeMobilePerformance();
            
            // Initialiser le système de traduction
            if (window.translationManager) {
                window.translationManager.init();
                console.log('✅ Système de traduction mobile initialisé');
                
                // Gestionnaire pour les changements de langue
                document.addEventListener('languageChanged', function(event) {
                    // Mettre à jour les modals ouverts
                    const openModal = document.querySelector('.project-details-modal-complete');
                    if (openModal) {
                        // Mettre à jour tous les éléments traduits dans le modal
                        openModal.querySelectorAll('[data-translate]').forEach(element => {
                            const key = element.getAttribute('data-translate');
                            element.textContent = window.translationManager.t(key);
                        });
                        
                        // Mettre à jour les éléments avec HTML généré dynamiquement
                        const historyElement = openModal.querySelector('[data-translate="kitchen_story"]');
                        if (historyElement) {
                            const storyText = window.translationManager.t('kitchen_story');
                            historyElement.innerHTML = storyText.split('\n\n').map(paragraph => `<p style="margin-bottom: 1rem;">${paragraph}</p>`).join('');
                        }
                    }
                });
            } else {
                console.warn('⚠️ TranslationManager non disponible sur mobile');
            }
            
            // Initialiser le panel d'options APRÈS les traductions
            initOptionsPanel();
            
            // Boutons menu principal
            document.getElementById('load-game').addEventListener('click', openPortfolioCollectibles);
            document.getElementById('contact').addEventListener('click', openContactWindow);
            document.getElementById('options').addEventListener('click', showOptions);
            document.getElementById('exit').addEventListener('click', exitSite);
            
            // Boutons retour
            document.getElementById('back-to-home').addEventListener('click', backToHome);
            document.getElementById('back-to-home-portfolio').addEventListener('click', backToHomeFromPortfolio);
            
            // Navigation projets
            document.getElementById('prev-project').addEventListener('click', previousProject);
            document.getElementById('next-project').addEventListener('click', nextProject);
            
            // Support tactile pour navigation des collectibles
            let touchStartX = 0;
            let touchStartY = 0;
            const portfolioWindow = document.getElementById('portfolio-window');
            
            portfolioWindow.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            portfolioWindow.addEventListener('touchend', function(e) {
                if (document.getElementById('portfolio-window').style.display === 'none') return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const diffX = touchStartX - touchEndX;
                const diffY = Math.abs(touchStartY - touchEndY);
                
                // Vérifier que c'est un swipe horizontal et pas vertical
                if (Math.abs(diffX) > 50 && diffY < 100) {
                    if (diffX > 0) {
                        nextProject(); // Swipe left -> projet suivant
                    } else {
                        previousProject(); // Swipe right -> projet précédent
                    }
                }
            });
            
            // Liens sociaux
            document.querySelectorAll('.social-logo').forEach(logo => {
                logo.addEventListener('click', function() {
                    const platform = this.dataset.platform;
                    openSocialLink(platform);
                });
            });
            
            // Navigation clavier
            document.addEventListener('keydown', function(e) {
                switch(e.code) {
                    case 'ArrowLeft':
                        if (document.getElementById('portfolio-window').style.display !== 'none') {
                            previousProject();
                        }
                        break;
                    case 'ArrowRight':
                        if (document.getElementById('portfolio-window').style.display !== 'none') {
                            nextProject();
                        }
                        break;
                    case 'Escape':
                        const modal = document.querySelector('.project-modal');
                        if (modal) {
                            closeProjectModal();
                        } else if (document.getElementById('portfolio-window').classList.contains('show')) {
                            backToHomeFromPortfolio();
                        } else if (document.getElementById('contact-window').classList.contains('show')) {
                            backToHome();
                        }
                        break;
                }
            });
            
            // Démarrer le chargement
            simulateLoading();
        });
        
        // Fonction globale pour fermer modal (accessible depuis HTML)
        window.closeProjectModal = closeProjectModal;
        window.restartExperience = restartExperience;
        window.goBackToMenu = goBackToMenu;
        
        // Gestion des erreurs
        window.onerror = function(msg, url, line, col, error) {
            console.error('Erreur JS:', { message: msg, url: url, line: line, column: col, error: error });
            return false;
        };
    </script>
</body>
</html>
