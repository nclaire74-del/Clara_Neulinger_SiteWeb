<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chara_Circus_Viewer</title>
    <style>
        body { margin: 0; padding: 0; background: #2a2a2a; overflow: hidden; }
        #marmoset-container { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #loading-message { color: white; font-family: Arial, sans-serif; font-size: 16px; text-align: center; }
        #error-message { color: #ff6b6b; font-family: Arial, sans-serif; font-size: 14px; text-align: center; padding: 20px; display: none; }
    </style>
</head>
<body>
    <div id="marmoset-container">
        <div id="loading-message">Chargement du viewer 3D...</div>
    </div>
    <div id="error-message">
        <h3>Erreur de chargement du viewer 3D</h3>
        <p>Le viewer Marmoset n'a pas pu se charger correctement.</p>
    </div>
    <script>
        let marmosetLoaded = false;
        let loadingTimeout = setTimeout(() => {
            if (!marmosetLoaded) {
                document.getElementById('loading-message').style.display = 'none';
                document.getElementById('error-message').style.display = 'block';
            }
        }, 15000);
        
        function initMarmoset() {
            try {
                if (typeof marmoset === 'undefined') throw new Error('Marmoset library not loaded');
                marmoset.embed('/Clara_Neulinger/05_PROJETS_3D/projets_portfolio/images/Circus/Chara_Circus_Viewer.mview', {
                    width: 500, height: 400, autoStart: true, fullFrame: true, pagePreset: false,
                    onLoad: function() {
                        marmosetLoaded = true;
                        clearTimeout(loadingTimeout);
                        document.getElementById('loading-message').style.display = 'none';
                    },
                    onError: function(error) {
                        clearTimeout(loadingTimeout);
                        document.getElementById('loading-message').style.display = 'none';
                        document.getElementById('error-message').style.display = 'block';
                    }
                });
            } catch (error) {
                clearTimeout(loadingTimeout);
                document.getElementById('loading-message').style.display = 'none';
                document.getElementById('error-message').style.display = 'block';
            }
        }
        
        const script = document.createElement('script');
        script.src = 'https://viewer.marmoset.co/main/marmoset.js';
        script.async = true;
        script.onload = () => setTimeout(initMarmoset, 100);
        script.onerror = () => {
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('error-message').style.display = 'block';
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
