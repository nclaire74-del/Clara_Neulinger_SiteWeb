<!DOCTYPE html>

    <style>
        @font-face {
            font-family: 'Kindergarten';
            src: url('/Clara_Neulinger/01_SITE_PRODUCTION/desktop/font/kindergarten.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        
        /* Reset et variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background: #000000 !important;
            font-family: 'Kindergarten', Arial, sans-serif;
        }
        
        /* Écran de chargement */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-title {
            font-family: 'Kindergarten', cursive;
            font-size: clamp(2rem, 5vw, 3rem);
            color: #f5f1e8;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .loading-subtitle {
            font-family: 'Kindergarten', cursive;
            font-size: clamp(1rem, 3vw, 1.4rem);
            color: #e8dcc0;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top: 3px solid #f5f1e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 2rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-bar-container {
            width: min(300px, 80vw);
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        
        #loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #f5f1e8, #e8dcc0);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        #loading-percentage {
            color: #f5f1e8;
            font-family: 'Kindergarten', cursive;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            margin-bottom: 0.5rem;
        }
        
        #loading-message {
            color: #e8dcc0;
            font-family: 'Kindergarten', cursive;
            font-size: clamp(0.8rem, 2vw, 1rem);
            text-align: center;
            padding: 0 1rem;
        }
        
        /* Vidéo de fond */
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        /* Effet de vignettage noir */
        #video-vignette-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.3) 70%, rgba(0, 0, 0, 0.7) 100%);
            z-index: 2;
            pointer-events: none;
        }
        
        /* Interface utilisateur principale */
        #main-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: none;
        }
        
        .ui-overlay {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            z-index: 10;
        }
        
        /* Titre du jeu */
        .game-title {
            text-align: center;
            margin-bottom: 3rem;
            z-index: 10;
        }
        
        .game-title h1 {
            font-family: 'Kindergarten', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: #f5f1e8;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            margin-bottom: 0.5rem;
        }
        
        .game-title .subtitle {
            font-family: 'Kindergarten', cursive;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: #e8dcc0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        
        /* Menu principal */
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        
        /* Boutons style jeu vidéo */
        .game-button {
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            border: 2px solid #f5f1e8;
            border-radius: 8px;
            padding: 1rem 2rem;
            font-family: 'Kindergarten', cursive;
            color: #f5f1e8;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 250px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .game-button:hover {
            background: linear-gradient(145deg, #3c3c3c, #2a2a2a);
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 241, 232, 0.3);
        }
        
        .game-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(245, 241, 232, 0.2);
        }
        
        .button-text {
            display: block;
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            font-weight: bold;
            margin-bottom: 0.2rem;
        }
        
        .button-subtitle {
            display: block;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #e8dcc0;
            opacity: 0.8;
        }
        
        /* Overlays/Windows */
        .contact-overlay, .portfolio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-y: auto;
        }
        
        .contact-overlay.show, .portfolio-overlay.show {
            display: flex;
        }
        
        /* Contact Window */
        .papers-container {
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            border: 2px solid #f5f1e8;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
        }
        
        .papers-container h2 {
            font-family: 'Kindergarten', cursive;
            color: #f5f1e8;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 2rem;
        }
        
        .papers-container p {
            color: #e8dcc0;
            font-family: 'Kindergarten', cursive;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            margin-bottom: 1rem;
        }
        
        /* Logos sociaux */
        .social-logos-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        
        .social-logo {

            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: 2px solid #f5f1e8;
        }
        
        .social-logo:hover {
            transform: scale(1.1);
            border-color: #fff;
        }
        
        .social-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .social-logos-instruction {
            margin-top: 1rem;
        }
        
        .social-logos-instruction p {
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #e8dcc0;
            opacity: 0.8;
        }
        
        /* Portfolio Window */
        .portfolio-overlay {
            background: rgba(0, 0, 0, 0.95);
            padding: 1rem;
        }
        
        /* En-tête des collectibles */
        .collectibles-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 0 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .collectibles-title {
            text-align: center;
            flex: 1;
        }
        
        .collectibles-title h2 {
            font-family: 'Kindergarten', cursive;
            color: #f5f1e8;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 0.5rem;
        }
        
        .category-counter {
            color: #e8dcc0;
            font-family: 'Kindergarten', cursive;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
        }
        
        .project-nav-btn {
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            border: 2px solid #f5f1e8;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            font-family: 'Kindergarten', cursive;
            color: #f5f1e8;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
        }
        
        .project-nav-btn:hover {
            background: linear-gradient(145deg, #3c3c3c, #2a2a2a);
            transform: translateY(-1px);
        }
        
        /* Séparateur décoratif */
        .collectibles-separator {
            height: 2px;
            background: linear-gradient(90deg, transparent, #f5f1e8, transparent);
            margin-bottom: 2rem;
            position: relative;
        }
        
        /* Container des projets */
        .collectibles-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }
        
        .project-showcase {
            width: 100%;
            max-width: 800px;
        }
        
        .project-item {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            border: 2px solid #f5f1e8;
            border-radius: 12px;
            padding: 2rem;
            position: relative;
        }
        
        @media (min-width: 768px) {
            .project-item {
                flex-direction: row;
                align-items: center;
            }
        }
        
        .project-media-wrapper {
            position: relative;
            flex: 1;
            min-height: 250px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .project-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }
        
        .project-media:hover {
            transform: scale(1.05);
        }
        
        .project-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 8px;
        }
        
        .project-media-wrapper:hover .project-overlay {
            opacity: 1;
        }
        
        .project-overlay-text {
            color: #f5f1e8;
            font-family: 'Kindergarten', cursive;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            text-align: center;
            padding: 1rem;
        }
        
        .mobile-instruction {
            display: block;
        }
        
        @media (min-width: 768px) {
            .mobile-instruction {
                display: none;
            }
        }
        
        .project-info-side {
            flex: 1;
            padding: 1rem 0;
        }
        
        @media (min-width: 768px) {
            .project-info-side {
                padding: 0 0 0 2rem;
            }
        }
        
        .project-info-side h3 {
            font-family: 'Kindergarten', cursive;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            color: #f5f1e8;
            margin-bottom: 1rem;
        }
        
        .project-description-additional p {
            color: #e8dcc0;
            font-family: 'Kindergarten', cursive;
            font-size: clamp(0.9rem, 2.2vw, 1.1rem);
            line-height: 1.4;
            margin-bottom: 1.5rem;
        }
        
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .tag {
            background: rgba(245, 241, 232, 0.2);
            color: #f5f1e8;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            font-family: 'Kindergarten', cursive;
            border: 1px solid rgba(245, 241, 232, 0.3);
        }
        
        .project-hint {
            margin-top: 1rem;
        }
        
        .project-hint small {
            color: #e8dcc0;
            font-family: 'Kindergarten', cursive;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            opacity: 0.8;
        }
        
        /* Bouton retour */
        .back-to-home-btn {
            margin-top: 2rem;
            align-self: center;
        }
        
        /* Effet TV Shutdown */
        .tv-shutdown {
            animation: tvShutdown 1.2s ease-in-out forwards;
        }
        
        @keyframes tvShutdown {
            0% {
                transform: scale(1, 1);
                opacity: 1;
            }
            50% {
                transform: scale(1, 0.05);
                opacity: 0.8;
            }
            100% {
                transform: scale(0, 0);
                opacity: 0;
            }
        }
        
        .shutdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 10000;
            opacity: 0;
            animation: shutdownFade 1.2s ease-in-out forwards;
        }
        
        @keyframes shutdownFade {
            0% { opacity: 0; }
            80% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        .try-again-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .try-again-overlay.show {
            opacity: 1;
        }
        
        .try-again-content {
            text-align: center;
            padding: 2rem;
        }
        
        .try-again-title {
            font-family: 'Kindergarten', cursive;
            font-size: clamp(2rem, 6vw, 3rem);
            color: #f5f1e8;
            margin-bottom: 2rem;
        }
        
        .try-again-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        
        @media (min-width: 480px) {
            .try-again-buttons {
                flex-direction: row;
                justify-content: center;
            }
        }
        
        .try-again-btn, .back-btn {
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            border: 2px solid #f5f1e8;
            border-radius: 8px;
            padding: 1rem 2rem;
            font-family: 'Kindergarten', cursive;
            color: #f5f1e8;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
        }
        
        .try-again-btn:hover, .back-btn:hover {
            background: linear-gradient(145deg, #3c3c3c, #2a2a2a);
            transform: translateY(-2px);
        }
        
        /* Modal pour les viewers 3D */
        .project-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .modal-title {
            font-family: 'Kindergarten', cursive;
            color: #f5f1e8;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
        }
        
        .modal-close {
            background: none;
            border: 2px solid #f5f1e8;
            color: #f5f1e8;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .modal-close:hover {
            background: #f5f1e8;
            color: #000;
        }
        
        .modal-content {
            flex: 1;
            background: #111;
            border: 2px solid #f5f1e8;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Responsive adaptations */
        @media (max-width: 768px) {
            .collectibles-header {
                flex-direction: column;
                text-align: center;
            }
            
            .project-nav-btn {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
            
            .papers-container {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            .social-logos-container {
                gap: 1rem;
            }
            
            .social-logo {
                width: 50px;
                height: 50px;
            }
        }
        
        @media (max-width: 480px) {
            .game-button {
                min-width: 200px;
                padding: 0.8rem 1.5rem;
            }
            
            .main-menu {
                gap: 1rem;
            }
            
            .project-item {
                padding: 1.5rem;
            }
            
            .collectibles-header {
                margin-bottom: 1rem;
            }
        }
    </style>
</head>

        // Simulation du loading manager
        let loadingProgress = 0;
        
        function simulateLoading() {
            const loadingBar = document.getElementById('loading-bar');
            const loadingPercentage = document.getElementById('loading-percentage');
            const loadingMessage = document.getElementById('loading-message');
            
            const messages = [
                'Compilation du shader...',
                'Chargement des textures...',
                'Initialisation des modèles 3D...',
                'Configuration mobile...',
                'Optimisation des performances...',
                'Finalisation...'
            ];
            
            const interval = setInterval(() => {
                loadingProgress += Math.random() * 15 + 5;
                
                if (loadingProgress >= 100) {
                    loadingProgress = 100;
                    clearInterval(interval);
                    setTimeout(hideLoader, 500);
                }
                
                loadingBar.style.width = loadingProgress + '%';
                loadingPercentage.textContent = Math.round(loadingProgress) + '%';
                loadingMessage.textContent = messages[Math.floor((loadingProgress / 100) * messages.length)];
            }, 200);
        }
        
        function hideLoader() {
            const loadingScreen = document.getElementById('loading-screen');
            const mainUI = document.getElementById('main-ui');
            
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.5s ease';
            
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                mainUI.style.display = 'block';
                
                // Démarrer la vidéo
                const video = document.getElementById('background-video');
                video.play().catch(e => console.log('Vidéo ne peut pas se lancer:', e));
            }, 500);
        }

        // Fonctions de navigation - EXACTEMENT comme desktop
        function openPortfolioCollectibles() {
            console.log('📁 Ouverture portfolio...');
            const mainUI = document.getElementById('main-ui');
            const portfolioWindow = document.getElementById('portfolio-window');
            
            if (mainUI) mainUI.style.display = 'none';
            if (portfolioWindow) {
                portfolioWindow.style.display = 'flex';
                portfolioWindow.classList.add('show');
            }
            
            updateProjectDisplay();
        }
        
        function openContactWindow() {
            console.log('📧 Ouverture contact...');
            const mainUI = document.getElementById('main-ui');
            const contactWindow = document.getElementById('contact-window');
            
            if (mainUI) mainUI.style.display = 'none';
            if (contactWindow) {
                contactWindow.style.display = 'flex';
                contactWindow.classList.add('show');
            }
        }
        
        function backToHome() {
            console.log('🏠 Retour accueil depuis contact...');
            const contactWindow = document.getElementById('contact-window');
            const mainUI = document.getElementById('main-ui');
            
            if (contactWindow) {
                contactWindow.classList.remove('show');
                contactWindow.style.display = 'none';
            }
            if (mainUI) mainUI.style.display = 'block';
        }
        
        function backToHomeFromPortfolio() {
            console.log('🏠 Retour accueil depuis portfolio...');
            const portfolioWindow = document.getElementById('portfolio-window');
            const mainUI = document.getElementById('main-ui');
            
            if (portfolioWindow) {
                portfolioWindow.classList.remove('show');
                portfolioWindow.style.display = 'none';
            }
            if (mainUI) mainUI.style.display = 'block';
        }
        
        function showOptions() {
            alert('Options:\n\n• Version Mobile Optimisée\n• Vidéo de fond: Activée\n• Qualité: Auto\n• Style: Desktop adapté\n\nParamètres configurés automatiquement pour votre appareil.');
        }
        
        // Effet TV Shutdown EXACT comme desktop
        function exitSite() {
            playTvShutdownEffect();
        }

        function playTvShutdownEffect() {
            const shutdownOverlay = document.createElement('div');
            shutdownOverlay.className = 'shutdown-overlay';
            document.body.appendChild(shutdownOverlay);

            const video = document.getElementById('background-video');
            const mainUI = document.getElementById('main-ui');
            const vignette = document.getElementById('video-vignette-overlay');

            if (video) video.classList.add('tv-shutdown');
            if (mainUI) mainUI.classList.add('tv-shutdown');
            if (vignette) vignette.classList.add('tv-shutdown');

            setTimeout(() => {
                showTryAgainScreen();
            }, 1200);
        }

        function showTryAgainScreen() {
            const tryAgainOverlay = document.createElement('div');
            tryAgainOverlay.className = 'try-again-overlay';
            tryAgainOverlay.innerHTML = `
                <div class="try-again-content">
                    <h1 class="try-again-title">Try Again</h1>
                    <div class="try-again-buttons">
                        <button class="game-button try-again-btn" onclick="restartExperience()">
                            <span class="button-text">Restart</span>
                        </button>
                        <button class="game-button back-btn" onclick="goBackToMenu()">
                            <span class="button-text">Back to Menu</span>
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(tryAgainOverlay);

            setTimeout(() => {
                tryAgainOverlay.classList.add('show');
            }, 400);
        }

        function restartExperience() {
            window.location.reload();
        }

        function goBackToMenu() {
            const overlays = document.querySelectorAll('.try-again-overlay, .shutdown-overlay');
            overlays.forEach(overlay => overlay.remove());

            const video = document.getElementById('background-video');
            const mainUI = document.getElementById('main-ui');
            const vignette = document.getElementById('video-vignette-overlay');

            if (video) video.classList.remove('tv-shutdown');
            if (mainUI) mainUI.classList.remove('tv-shutdown');
            if (vignette) vignette.classList.remove('tv-shutdown');
        }

        // Navigation des projets
        function previousProject() {
            currentProject = (currentProject - 1 + projects.length) % projects.length;
            updateProjectDisplay();
        }
        
        function nextProject() {
            currentProject = (currentProject + 1) % projects.length;
            updateProjectDisplay();
        }
        
        function updateProjectDisplay() {
            const project = projects[currentProject];
            const showcase = document.getElementById('project-showcase');
            const currentItem = document.getElementById('current-item');
            const totalItems = document.getElementById('total-items');
            
            currentItem.textContent = currentProject + 1;
            totalItems.textContent = projects.length;
            
            showcase.innerHTML = `
                <div class="project-item active" data-project="${project.id}">
                    <div class="project-media-wrapper" onclick="openProjectDetails(${project.id})">
                        <img class="project-media" src="${project.image}" alt="${project.title}" onerror="this.src='/Clara_Neulinger/05_PROJETS_3D/projets_portfolio/Gun/NEULINGER_Clara_2B3DArt_Rendu_Texture.jpg'">
                        <div class="project-overlay">
                            <div class="project-overlay-text">
                                <span class="mobile-instruction">Touchez pour explorer</span>
                            </div>
                        </div>
                    </div>
                    <div class="project-info-side">
                        <h3>${project.title}</h3>
                        <div class="project-description-additional">
                            <p>${project.description}</p>
                        </div>
                        <div class="project-tags">
                            ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <div class="project-hint">
                            <small>💡 Touchez l'image pour accéder au viewer 3D interactif</small>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function openProjectDetails(projectId) {
            const project = projects.find(p => p.id === projectId);
            console.log('🎯 Ouverture viewer pour:', project.title);
            
            // Créer un modal avec le viewer 3D - EXACTEMENT comme desktop
            const modal = document.createElement('div');
            modal.className = 'project-modal';
            modal.innerHTML = `
                <div class="modal-header">
                    <h2 class="modal-title">${project.title}</h2>
                    <button class="modal-close" onclick="closeProjectModal()">&times;</button>
                </div>
                <div class="modal-content">
                    <iframe src="${project.viewer}" title="${project.title} - Viewer 3D">
                        <p style="color: #f5f1e8; text-align: center; padding: 20px;">Chargement du viewer 3D...</p>
                    </iframe>
                </div>
            `;
            
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';
        }
        
        function closeProjectModal() {
            const modal = document.querySelector('.project-modal');
            if (modal) {
                modal.remove();
                document.body.style.overflow = '';
            }
        }
        
        // Liens sociaux
        function openSocialLink(platform) {
            const links = {
                artstation: 'https://www.artstation.com',
                linkedin: 'https://www.linkedin.com',
                rookies: 'https://www.therookies.co'
            };
            
            if (links[platform]) {
                window.open(links[platform], '_blank');
            }
        }

        // Event Listeners - EXACTEMENT comme desktop
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Site mobile Clara Neulinger avec fonctionnalités desktop !');
            
            // Boutons menu principal
            document.getElementById('load-game').addEventListener('click', openPortfolioCollectibles);
            document.getElementById('contact').addEventListener('click', openContactWindow);
            document.getElementById('options').addEventListener('click', showOptions);
            document.getElementById('exit').addEventListener('click', exitSite);
            
            // Boutons retour
            document.getElementById('back-to-home').addEventListener('click', backToHome);
            document.getElementById('back-to-home-portfolio').addEventListener('click', backToHomeFromPortfolio);
            
            // Navigation projets
            document.getElementById('prev-project').addEventListener('click', previousProject);
            document.getElementById('next-project').addEventListener('click', nextProject);
            
            // Liens sociaux
            document.querySelectorAll('.social-logo').forEach(logo => {
                logo.addEventListener('click', function() {
                    const platform = this.dataset.platform;
                    openSocialLink(platform);
                });
            });
            
            // Navigation clavier
            document.addEventListener('keydown', function(e) {
                switch(e.code) {
                    case 'ArrowLeft':
                        if (document.getElementById('portfolio-window').style.display !== 'none') {
                            previousProject();
                        }
                        break;
                    case 'ArrowRight':
                        if (document.getElementById('portfolio-window').style.display !== 'none') {
                            nextProject();
                        }
                        break;
                    case 'Escape':
                        const modal = document.querySelector('.project-modal');
                        if (modal) {
                            closeProjectModal();
                        } else if (document.getElementById('portfolio-window').classList.contains('show')) {
                            backToHomeFromPortfolio();
                        } else if (document.getElementById('contact-window').classList.contains('show')) {
                            backToHome();
                        }
                        break;
                }
            });
            
            // Démarrer le chargement
            simulateLoading();
        });
        
        // Fonction globale pour fermer modal (accessible depuis HTML)
        window.closeProjectModal = closeProjectModal;
        window.restartExperience = restartExperience;
        window.goBackToMenu = goBackToMenu;
        
        // Gestion des erreurs
        window.onerror = function(msg, url, line, col, error) {
            console.error('Erreur JS:', { message: msg, url: url, line: line, column: col, error: error });
            return false;
        };
    </script>
