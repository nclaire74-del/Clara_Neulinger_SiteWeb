<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Logos et Viewers</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #1a1a1a; 
            color: #fff; 
            line-height: 1.6;
        }
        .test-item { 
            margin: 10px 0; 
            padding: 15px; 
            background: #333; 
            border-radius: 5px; 
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .success { background: #2d5016; border-left: 3px solid #4CAF50; }
        .error { background: #501616; border-left: 3px solid #f44336; }
        .loading { background: #1e3a8a; border-left: 3px solid #2196F3; }
        
        img { 
            max-width: 50px; 
            max-height: 50px; 
            border-radius: 3px;
            flex-shrink: 0;
        }
        
        .info { flex: 1; }
        .path { font-family: monospace; font-size: 12px; color: #888; margin-top: 5px; }
        
        iframe { 
            width: 300px; 
            height: 200px; 
            border: 1px solid #555; 
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🔍 Test Final - Logos et Viewers</h1>
    
    <h2>🖼️ Test Logos Problématiques</h2>
    <div id="logo-tests"></div>
    
    <h2>🎮 Test Viewers HTML</h2>
    <div id="viewer-tests"></div>

    <script>
        function testLogo(path, name, container) {
            const testDiv = document.createElement('div');
            testDiv.className = 'test-item loading';
            
            const img = document.createElement('img');
            img.src = path;
            
            const info = document.createElement('div');
            info.className = 'info';
            info.innerHTML = `
                <strong>⏳ ${name}</strong>
                <div class="path">${path}</div>
            `;
            
            testDiv.appendChild(img);
            testDiv.appendChild(info);
            container.appendChild(testDiv);
            
            img.addEventListener('load', () => {
                testDiv.className = 'test-item success';
                info.innerHTML = `
                    <strong>✅ ${name} OK</strong>
                    <div class="path">${path}</div>
                `;
            });
            
            img.addEventListener('error', () => {
                testDiv.className = 'test-item error';
                info.innerHTML = `
                    <strong>❌ ${name} ERREUR</strong>
                    <div class="path">${path}</div>
                `;
            });
        }

        function testViewer(path, name, container) {
            const testDiv = document.createElement('div');
            testDiv.className = 'test-item loading';
            
            const iframe = document.createElement('iframe');
            iframe.src = path;
            
            const info = document.createElement('div');
            info.className = 'info';
            info.innerHTML = `
                <strong>⏳ ${name}</strong>
                <div class="path">${path}</div>
            `;
            
            testDiv.appendChild(iframe);
            testDiv.appendChild(info);
            container.appendChild(testDiv);
            
            iframe.addEventListener('load', () => {
                testDiv.className = 'test-item success';
                info.innerHTML = `
                    <strong>✅ ${name} OK</strong>
                    <div class="path">${path}</div>
                `;
            });
            
            iframe.addEventListener('error', () => {
                testDiv.className = 'test-item error';
                info.innerHTML = `
                    <strong>❌ ${name} ERREUR</strong>
                    <div class="path">${path}</div>
                `;
            });
        }

        // Test des logos
        const logoContainer = document.getElementById('logo-tests');
        testLogo('/Clara_Neulinger/assets/images/Logos/Marvelous_Designer.png', 'Marvelous Designer', logoContainer);
        testLogo('/Clara_Neulinger/assets/images/Logos/Marmoset.png', 'Marmoset', logoContainer);
        testLogo('/Clara_Neulinger/assets/images/Logos/zbrush.png', 'ZBrush', logoContainer);

        // Test des viewers
        const viewerContainer = document.getElementById('viewer-tests');
        testViewer('/Clara_Neulinger/assets/images/Room/Room_Viewer_Test.html', 'Room Viewer Test', viewerContainer);
    </script>
</body>
</html>
