<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara Neulinger - Mobile SIMPLE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #00aaff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        
        /* Vidéo de fond */
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        /* Interface par-dessus */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .game-title {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .game-title h1 {
            font-size: 3rem;
            color: #00aaff;
            text-shadow: 0 0 20px rgba(0, 170, 255, 0.5);
            margin-bottom: 10px;
        }
        
        .game-title .subtitle {
            font-size: 1.2rem;
            color: #ccc;
        }
        
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
            max-width: 90vw;
        }
        
        .game-button {
            background: rgba(0, 170, 255, 0.1);
            border: 2px solid #00aaff;
            color: #00aaff;
            padding: 15px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .game-button:hover {
            background: rgba(0, 170, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
            transform: translateX(5px);
        }
        
        .button-text {
            display: block;
            font-weight: bold;
            font-size: 18px;
        }
        
        .button-subtitle {
            display: block;
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
        
        /* Portfolio simple */
        #portfolio-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00aaff;
        }
        
        .portfolio-content {
            text-align: center;
            padding: 40px;
        }
        
        .portfolio-content h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #00aaff;
        }
        
        .portfolio-viewer {
            width: 80vw;
            height: 60vh;
            max-width: 800px;
            max-height: 600px;
            border: 2px solid #00aaff;
            border-radius: 10px;
            margin: 20px 0;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .back-btn {
            margin-top: 20px;
            background: #00aaff;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .back-btn:hover {
            background: #0088cc;
        }
    </style>
</head>
<body>
    <!-- Vidéo d'arrière-plan -->
    <video id="background-video" 
           muted 
           loop 
           playsinline 
           autoplay>
        <source src="/Clara_Neulinger/05_PROJETS_3D/projets_portfolio/Cirucs/Neulinger_Clara_3B3D_Circus_Render_Video.mp4" type="video/mp4">
    </video>

    <!-- Interface principale -->
    <div class="ui-overlay" id="main-ui">
        <div class="game-title">
            <h1>Clara Neulinger</h1>
            <p class="subtitle">Portfolio 3D</p>
        </div>

        <div class="main-menu">
            <button class="game-button" onclick="openPortfolio()">
                <span class="button-text">Load Game</span>
                <span class="button-subtitle">Portfolio & Projets</span>
            </button>
            
            <button class="game-button" onclick="alert('Contact: claraneulinger1@gmail.com')">
                <span class="button-text">Contact</span>
                <span class="button-subtitle">Informations & Réseaux</span>
            </button>
            
            <button class="game-button" onclick="alert('Options non disponibles')">
                <span class="button-text">Options</span>
                <span class="button-subtitle">Son & Langue</span>
            </button>
            
            <button class="game-button" onclick="alert('Merci de votre visite!')">
                <span class="button-text">Exit</span>
                <span class="button-subtitle">Quitter</span>
            </button>
        </div>
    </div>

    <!-- Portfolio -->
    <div id="portfolio-window">
        <div class="portfolio-content">
            <h2>🔫 Plasma Pistol</h2>
            <div class="portfolio-viewer">
                <iframe 
                    src="/Clara_Neulinger/05_PROJETS_3D/projets_portfolio/Gun/Plasma_Pistol_Viewer.html"
                    width="100%" 
                    height="100%" 
                    frameborder="0">
                </iframe>
            </div>
            <button class="back-btn" onclick="backToHome()">Retour Accueil</button>
        </div>
    </div>

    <script>
        console.log('🚀 Site mobile simple chargé');
        
        // Fonctions de navigation ultra-simples
        function openPortfolio() {
            console.log('📁 Ouverture portfolio...');
            document.getElementById('main-ui').style.display = 'none';
            document.getElementById('portfolio-window').style.display = 'flex';
        }
        
        function backToHome() {
            console.log('🏠 Retour accueil...');
            document.getElementById('portfolio-window').style.display = 'none';
            document.getElementById('main-ui').style.display = 'flex';
        }
        
        // Démarrage de la vidéo si elle ne se lance pas automatiquement
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('background-video');
            
            // Forcer la lecture si nécessaire
            video.play().catch(e => {
                console.log('Vidéo ne peut pas se lancer automatiquement:', e);
            });
            
            console.log('✅ Site mobile simple prêt !');
        });
    </script>
</body>
</html>
