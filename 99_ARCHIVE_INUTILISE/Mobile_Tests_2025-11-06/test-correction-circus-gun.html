<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Correction Circus/Gun Assets</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #1a1a1a; 
            color: #fff; 
            line-height: 1.6;
        }
        .section { 
            margin: 20px 0; 
            padding: 15px; 
            background: #2a2a2a; 
            border-radius: 8px; 
            border-left: 4px solid #4CAF50;
        }
        .test-item { 
            margin: 10px 0; 
            padding: 10px; 
            background: #333; 
            border-radius: 5px; 
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .success { background: #2d5016; border-left: 3px solid #4CAF50; }
        .error { background: #501616; border-left: 3px solid #f44336; }
        .loading { background: #1e3a8a; border-left: 3px solid #2196F3; }
        
        img { 
            max-width: 100px; 
            max-height: 80px; 
            border-radius: 5px; 
            object-fit: cover;
            flex-shrink: 0;
        }
        
        .info { flex: 1; }
        .path { font-family: monospace; font-size: 12px; color: #888; margin-top: 5px; }
        
        .summary { 
            position: fixed; 
            top: 10px; 
            right: 10px; 
            background: #333; 
            padding: 15px; 
            border-radius: 8px; 
            min-width: 200px;
            z-index: 1000;
        }
        .counter { display: inline-block; margin: 5px 10px; font-weight: bold; }
        .success-count { color: #4CAF50; }
        .error-count { color: #f44336; }
        .total-count { color: #2196F3; }
    </style>
</head>
<body>
    <div class="summary">
        <h3>📊 Résumé Tests</h3>
        <div class="counter success-count">✅ <span id="success-count">0</span></div>
        <div class="counter error-count">❌ <span id="error-count">0</span></div>
        <div class="counter total-count">📋 <span id="total-count">0</span></div>
    </div>

    <h1>🔧 Test Correction Circus/Gun Assets</h1>
    
    <div class="section">
        <h2>🎪 Projet Circus - Assets dans Cirucs/</h2>
        <div id="circus-assets"></div>
    </div>

    <div class="section">
        <h2>🔫 Projet Gun - Viewer Corrigé</h2>
        <div id="gun-assets"></div>
    </div>

    <div class="section">
        <h2>🎮 Viewers HTML</h2>
        <div id="viewer-tests"></div>
    </div>

    <script>
        let successCount = 0;
        let errorCount = 0;
        let totalCount = 0;

        function updateCounters() {
            document.getElementById('success-count').textContent = successCount;
            document.getElementById('error-count').textContent = errorCount;
            document.getElementById('total-count').textContent = totalCount;
        }

        function testAsset(path, container, description) {
            totalCount++;
            updateCounters();

            const testDiv = document.createElement('div');
            testDiv.className = 'test-item loading';
            
            const img = document.createElement('img');
            img.src = path;
            
            const info = document.createElement('div');
            info.className = 'info';
            info.innerHTML = `
                <strong>⏳ ${description}</strong>
                <div class="path">${path}</div>
            `;
            
            testDiv.appendChild(img);
            testDiv.appendChild(info);
            container.appendChild(testDiv);
            
            img.addEventListener('load', () => {
                testDiv.className = 'test-item success';
                info.innerHTML = `
                    <strong>✅ ${description}</strong>
                    <div class="path">${path}</div>
                `;
                successCount++;
                updateCounters();
            });
            
            img.addEventListener('error', () => {
                testDiv.className = 'test-item error';
                info.innerHTML = `
                    <strong>❌ ${description} ERREUR</strong>
                    <div class="path">${path}</div>
                `;
                errorCount++;
                updateCounters();
            });
        }

        function testViewer(path, name, container) {
            totalCount++;
            updateCounters();

            const testDiv = document.createElement('div');
            testDiv.className = 'test-item loading';
            
            const info = document.createElement('div');
            info.className = 'info';
            info.innerHTML = `
                <strong>⏳ Test ${name}</strong>
                <div class="path">${path}</div>
            `;
            
            testDiv.appendChild(info);
            container.appendChild(testDiv);
            
            fetch(path)
                .then(response => {
                    if (response.ok) {
                        testDiv.className = 'test-item success';
                        info.innerHTML = `
                            <strong>✅ ${name} OK</strong>
                            <div class="path">${path}</div>
                        `;
                        successCount++;
                    } else {
                        testDiv.className = 'test-item error';
                        info.innerHTML = `
                            <strong>❌ ${name} ERREUR ${response.status}</strong>
                            <div class="path">${path}</div>
                        `;
                        errorCount++;
                    }
                    updateCounters();
                })
                .catch(error => {
                    testDiv.className = 'test-item error';
                    info.innerHTML = `
                        <strong>❌ ${name} ERREUR</strong>
                        <div class="path">${path}</div>
                    `;
                    errorCount++;
                    updateCounters();
                });
        }

        // Tests Circus Assets (dans Cirucs/)
        const circusContainer = document.getElementById('circus-assets');
        testAsset('/Clara_Neulinger/assets/images/Cirucs/Neulinger_Clara_3B3D_Circus_References.jpg', circusContainer, 'Circus References');
        testAsset('/Clara_Neulinger/assets/images/Cirucs/Neulinger_Clara_3B3D_Circus_References_2.jpg', circusContainer, 'Circus References 2');
        testAsset('/Clara_Neulinger/assets/images/Cirucs/Neulinger_Clara_3B3D_Circus_Enviro_Sculpt_1.jpg', circusContainer, 'Circus Enviro Sculpt');
        testAsset('/Clara_Neulinger/assets/images/Cirucs/Neulinger_Clara_3B3D_Circus_Chara_Renders_1.jpg', circusContainer, 'Circus Chara Render');

        // Tests Gun Assets
        const gunContainer = document.getElementById('gun-assets');
        testAsset('/Clara_Neulinger/assets/images/Gun/NEULINGER_Clara_2B3DArt_Rendu_Texture.jpg', gunContainer, 'Gun Texture Main');
        testAsset('/Clara_Neulinger/assets/images/Gun/1.png', gunContainer, 'Gun Vue 1');
        testAsset('/Clara_Neulinger/assets/images/Gun/4.png', gunContainer, 'Gun Vue 4');

        // Tests Viewers
        const viewerContainer = document.getElementById('viewer-tests');
        testViewer('/Clara_Neulinger/assets/images/Cirucs/Circus_Viewer.html', 'Circus Viewer', viewerContainer);
        testViewer('/Clara_Neulinger/assets/images/Cirucs/Chara_Circus_Viewer.html', 'Chara Circus Viewer', viewerContainer);
        testViewer('/Clara_Neulinger/assets/images/Gun/Gun_Viewer.html', 'Gun Viewer', viewerContainer);
        testViewer('/Clara_Neulinger/assets/images/Gun/Plasma_Pistol_Viewer.html', 'Plasma Pistol Viewer', viewerContainer);

        // Message final
        setTimeout(() => {
            const totalTests = totalCount;
            const completedTests = successCount + errorCount;
            
            if (completedTests === totalTests) {
                const resultMessage = document.createElement('div');
                resultMessage.className = errorCount === 0 ? 'section success' : 'section';
                resultMessage.innerHTML = `
                    <h2>🎯 Résultat Final</h2>
                    <p><strong>Tests terminés:</strong> ${completedTests}/${totalTests}</p>
                    <p><strong>Succès:</strong> ${successCount} ✅</p>
                    <p><strong>Erreurs:</strong> ${errorCount} ❌</p>
                    ${errorCount === 0 ? 
                        '<p style="color: #4CAF50; font-weight: bold;">🎉 Toutes les corrections sont OK !</p>' : 
                        '<p style="color: #ff9800; font-weight: bold;">⚠️ Certains assets ont encore des erreurs.</p>'
                    }
                `;
                document.body.appendChild(resultMessage);
            }
        }, 4000);
    </script>
</body>
</html>
