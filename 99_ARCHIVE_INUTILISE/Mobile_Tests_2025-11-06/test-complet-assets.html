<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Complet Assets Mobile</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #1a1a1a; 
            color: #fff; 
            line-height: 1.6;
        }
        .section { 
            margin: 20px 0; 
            padding: 15px; 
            background: #2a2a2a; 
            border-radius: 8px; 
            border-left: 4px solid #4CAF50;
        }
        .test-item { 
            margin: 10px 0; 
            padding: 10px; 
            background: #333; 
            border-radius: 5px; 
        }
        .success { background: #2d5016; border-left: 3px solid #4CAF50; }
        .error { background: #501616; border-left: 3px solid #f44336; }
        .warning { background: #4a3c00; border-left: 3px solid #ff9800; }
        .loading { background: #1e3a8a; border-left: 3px solid #2196F3; }
        img, video { max-width: 150px; max-height: 100px; margin: 5px; border-radius: 3px; }
        .summary { 
            position: fixed; 
            top: 10px; 
            right: 10px; 
            background: #333; 
            padding: 15px; 
            border-radius: 8px; 
            min-width: 200px;
        }
        .counter { display: inline-block; margin: 5px 10px; font-weight: bold; }
        .success-count { color: #4CAF50; }
        .error-count { color: #f44336; }
        .total-count { color: #2196F3; }
    </style>
</head>
<body>
    <div class="summary">
        <h3>📊 Résumé</h3>
        <div class="counter success-count">✅ <span id="success-count">0</span></div>
        <div class="counter error-count">❌ <span id="error-count">0</span></div>
        <div class="counter total-count">📋 <span id="total-count">0</span></div>
    </div>

    <h1>🔍 Vérification Complète des Assets Mobile</h1>
    
    <div class="section">
        <h2>🖼️ Images de Contact</h2>
        <div id="contact-assets"></div>
    </div>

    <div class="section">
        <h2>📁 Images CV (References_Papiers)</h2>
        <div id="cv-assets"></div>
    </div>

    <div class="section">
        <h2>🎥 Vidéos</h2>
        <div id="video-assets"></div>
    </div>

    <div class="section">
        <h2>🖥️ Logos et Icônes</h2>
        <div id="logo-assets"></div>
    </div>

    <div class="section">
        <h2>🎨 Portfolio 3D</h2>
        <div id="portfolio-assets"></div>
    </div>

    <script>
        let successCount = 0;
        let errorCount = 0;
        let totalCount = 0;

        function updateCounters() {
            document.getElementById('success-count').textContent = successCount;
            document.getElementById('error-count').textContent = errorCount;
            document.getElementById('total-count').textContent = totalCount;
        }

        function testAsset(path, container, description, type = 'image') {
            totalCount++;
            updateCounters();

            const testDiv = document.createElement('div');
            testDiv.className = 'test-item loading';
            testDiv.innerHTML = `⏳ <strong>${description}:</strong> ${path}`;
            container.appendChild(testDiv);

            if (type === 'video') {
                const video = document.createElement('video');
                video.src = path;
                video.controls = true;
                video.style.maxWidth = '200px';
                video.style.maxHeight = '120px';
                
                video.addEventListener('loadeddata', () => {
                    testDiv.className = 'test-item success';
                    testDiv.innerHTML = `✅ <strong>${description} OK:</strong> ${path}<br>${video.outerHTML}`;
                    successCount++;
                    updateCounters();
                });
                
                video.addEventListener('error', (e) => {
                    testDiv.className = 'test-item error';
                    testDiv.innerHTML = `❌ <strong>${description} ERREUR:</strong> ${path}<br>Erreur: ${e.type}`;
                    errorCount++;
                    updateCounters();
                });
                
            } else {
                const img = document.createElement('img');
                img.src = path;
                
                img.addEventListener('load', () => {
                    testDiv.className = 'test-item success';
                    testDiv.innerHTML = `✅ <strong>${description} OK:</strong> ${path}<br>${img.outerHTML}`;
                    successCount++;
                    updateCounters();
                });
                
                img.addEventListener('error', (e) => {
                    testDiv.className = 'test-item error';
                    testDiv.innerHTML = `❌ <strong>${description} ERREUR:</strong> ${path}<br>Erreur: ${e.type}`;
                    errorCount++;
                    updateCounters();
                });
            }
        }

        // Tests des assets de contact
        const contactContainer = document.getElementById('contact-assets');
        testAsset('assets/images/Contact/Cv_fr.svg', contactContainer, 'CV Français SVG');
        testAsset('assets/images/Contact/2.svg', contactContainer, 'Contact SVG 2');

        // Tests des CVs (References_Papiers)
        const cvContainer = document.getElementById('cv-assets');
        testAsset('../../References_Papiers/CV/Neulinger_Clara_Cv_page-0001.jpg', cvContainer, 'CV FR Page 1');
        testAsset('../../References_Papiers/CV/Neulinger_Clara_Resume_page-0001.jpg', cvContainer, 'Resume EN Page 1');

        // Tests des vidéos
        const videoContainer = document.getElementById('video-assets');
        testAsset('assets/videos/Neulinger_Clara_3B3D_Circus_Render_Video.mp4', videoContainer, 'Vidéo Accueil Circus', 'video');

        // Tests des logos
        const logoContainer = document.getElementById('logo-assets');
        testAsset('assets/images/Logos/pngwing.com.png', logoContainer, 'Logo PNG Wing');
        testAsset('assets/images/Logos/—Pngtree—linkedin social media icon_3609691.png', logoContainer, 'Logo LinkedIn');
        testAsset('assets/images/Logos/The_Rookies.jpg', logoContainer, 'Logo The Rookies');

        // Tests des assets portfolio 3D (chemins absolus)
        const portfolioContainer = document.getElementById('portfolio-assets');
        testAsset('/Clara_Neulinger/05_PROJETS_3D/projets_portfolio/images/Gun/NEULINGER_Clara_2B3DArt_Rendu_Texture.jpg', portfolioContainer, 'Portfolio Gun Texture');
        testAsset('/Clara_Neulinger/05_PROJETS_3D/projets_portfolio/images/Kitchen/preview.jpg', portfolioContainer, 'Portfolio Kitchen Preview');
        testAsset('/Clara_Neulinger/05_PROJETS_3D/projets_portfolio/images/Room/Untitled_Camera 1_FullQuality.jpg', portfolioContainer, 'Portfolio Room Full Quality');
        testAsset('/Clara_Neulinger/05_PROJETS_3D/projets_portfolio/images/Telephone/NEULINGER_CLARA_2B3DART_TELEPHONE_5.jpg', portfolioContainer, 'Portfolio Téléphone');
        testAsset('/Clara_Neulinger/05_PROJETS_3D/projets_portfolio/images/Arch/BASE COLOR/NewLevelSequence.0128.jpeg', portfolioContainer, 'Portfolio Arch Base Color');

        // Message final après 3 secondes
        setTimeout(() => {
            const totalTests = totalCount;
            const completedTests = successCount + errorCount;
            
            if (completedTests === totalTests) {
                const resultMessage = document.createElement('div');
                resultMessage.className = errorCount === 0 ? 'section success' : 'section warning';
                resultMessage.innerHTML = `
                    <h2>🎯 Résultat Final</h2>
                    <p><strong>Tests terminés:</strong> ${completedTests}/${totalTests}</p>
                    <p><strong>Succès:</strong> ${successCount} ✅</p>
                    <p><strong>Erreurs:</strong> ${errorCount} ❌</p>
                    ${errorCount === 0 ? 
                        '<p style="color: #4CAF50; font-weight: bold;">🎉 Tous les assets sont chargés correctement !</p>' : 
                        '<p style="color: #ff9800; font-weight: bold;">⚠️ Certains assets ont des erreurs de chargement.</p>'
                    }
                `;
                document.body.appendChild(resultMessage);
            }
        }, 3000);
    </script>
</body>
</html>
